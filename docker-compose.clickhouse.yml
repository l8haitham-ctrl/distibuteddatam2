# Apply last, after the five existing demonstration Compose files (including soccer).
services:
  native-ingestion-check:
    profiles: [tools]
    image: distributed-data-benchmark:local
    entrypoint: ["node", "/checks/verify-native-ingestion.mjs"]
    environment:
      APP_LOGIN_USERNAME: ${APP_LOGIN_USERNAME:-admin}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:?Define APP_LOGIN_PASSWORD}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?Run scripts/setup-clickhouse.ps1}
    volumes:
      - ./scripts:/checks:ro
      - ./work/native-ingestion:/results
    mem_limit: 128m
  clickhouse-source:
    image: clickhouse/clickhouse-server@sha256:c6602218b19b36728a0c903372b7748279c9316490f6e114c827e1de995fabde
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: atlas_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Run scripts/setup-clickhouse.ps1}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?Run scripts/setup-clickhouse.ps1}
    volumes:
      - clickhouse-source-data:/var/lib/clickhouse
      - ./infra/clickhouse/users.xml:/etc/clickhouse-server/users.d/atlas-reader.xml:ro
      - ./infra/clickhouse/config.xml:/etc/clickhouse-server/config.d/atlas-limits.xml:ro
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD-SHELL", 'CLICKHOUSE_PASSWORD="$${CLICKHOUSE_READER_PASSWORD}" clickhouse-client --user atlas_reader --query "SELECT 1" | grep -qx 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 768m
    restart: unless-stopped
  clickhouse-init:
    image: clickhouse/clickhouse-server@sha256:c6602218b19b36728a0c903372b7748279c9316490f6e114c827e1de995fabde
    depends_on:
      clickhouse-source:
        condition: service_healthy
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Run scripts/setup-clickhouse.ps1}
    volumes:
      - ./infra/clickhouse/01-demo.sql:/fixtures/01-demo.sql:ro
    entrypoint: ["/bin/sh", "-ec"]
    command: ["clickhouse-client --host clickhouse-source --user atlas_admin --multiquery < /fixtures/01-demo.sql"]
    restart: "no"
  backend:
    environment:
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?Run scripts/setup-clickhouse.ps1}
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
  spark-worker:
    environment:
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?Run scripts/setup-clickhouse.ps1}
  backend-tests:
    environment:
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?Run scripts/setup-clickhouse.ps1}
      RUN_CLICKHOUSE_TESTS: "true"
volumes:
  clickhouse-source-data:
