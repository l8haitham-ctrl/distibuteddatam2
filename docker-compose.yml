name: distributed-data

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" -o /dev/null'
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
    volumes:
      - ./sql:/scripts:ro
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - bash /scripts/init.sh
    restart: "no"

  backend-init:
    image: distributed-data-backend:local
    build: ./backend
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
      SOURCE_PASSWORD: ${LAKE_READER_PASSWORD:?Define LAKE_READER_PASSWORD in .env}
    command: ["--spring.main.web-application-type=none", "--app.provision=true"]
    restart: "no"

  backend:
    image: distributed-data-backend:local
    build: ./backend
    depends_on:
      backend-init:
        condition: service_completed_successfully
    environment:
      SOURCE_HOST: sqlserver
      SOURCE_DATABASE: BusinessDB
      SOURCE_USERNAME: lake_reader
      SOURCE_PASSWORD: ${LAKE_READER_PASSWORD:?Define LAKE_READER_PASSWORD in .env}
      SOURCE_TRUST_SERVER_CERTIFICATE: "true"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: distributed-data-frontend:local
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  backend-tests:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    depends_on:
      backend:
        condition: service_healthy
    environment:
      RUN_DB_TESTS: "true"
      SOURCE_HOST: sqlserver
      SOURCE_PASSWORD: ${LAKE_READER_PASSWORD:?Define LAKE_READER_PASSWORD in .env}
      SOURCE_TRUST_SERVER_CERTIFICATE: "true"
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
    command: ["mvn", "-B", "test"]

volumes:
  sqlserver-data:
  maven-cache:

