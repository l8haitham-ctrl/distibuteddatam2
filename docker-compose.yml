name: distributed-data

x-catalog-env: &catalog-env
  CATALOG_ENABLED: "true"
  TRINO_JDBC_URL: jdbc:trino://trino:8443/hive?SSL=true&SSLVerification=NONE
  TRINO_REGISTRAR_PASSWORD: ${TRINO_REGISTRAR_PASSWORD:?Define TRINO_REGISTRAR_PASSWORD in .env}
  TRINO_READER_PASSWORD: ${TRINO_READER_PASSWORD:?Define TRINO_READER_PASSWORD in .env}

services:
  metadata:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD in .env}
      JOBS_PASSWORD: ${JOBS_PASSWORD:?Define JOBS_PASSWORD in .env}
      METASTORE_PASSWORD: ${METASTORE_PASSWORD:?Define METASTORE_PASSWORD in .env}
    volumes:
      - metadata-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U atlas_admin -d atlas"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  spark-master:
    image: distributed-data-spark:local
    build:
      context: .
      dockerfile: spark/Dockerfile
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SPARK_MASTER_OPTS: -Dspark.master.rest.enabled=true -Dspark.master.rest.host=0.0.0.0 -Dspark.deploy.recoveryMode=FILESYSTEM -Dspark.deploy.recoveryDirectory=/opt/spark/recovery
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    volumes:
      - spark-recovery:/opt/spark/recovery
    ports:
      - "127.0.0.1:${SPARK_UI_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/json/ | grep -E '\"status\"[[:space:]]*:[[:space:]]*\"ALIVE\"' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  spark-worker:
    image: distributed-data-spark:local
    build:
      context: .
      dockerfile: spark/Dockerfile
    depends_on:
      spark-master:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    environment:
      SPARK_DAEMON_MEMORY: 256m
      SOURCE_HOST: sqlserver
      SOURCE_PORT: "1433"
      SOURCE_DATABASE: BusinessDB
      SOURCE_USERNAME: lake_reader
      SOURCE_PASSWORD: ${LAKE_READER_PASSWORD:?Define LAKE_READER_PASSWORD in .env}
      SOURCE_TRUST_SERVER_CERTIFICATE: "true"
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-lake}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Define STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Define STORAGE_SECRET_KEY in .env}
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "--cores", "2", "--memory", "2g", "--webui-port", "8081", "spark://spark-master:7077"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/json/"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  minio:
    image: distributed-data-minio:local
    build: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD in .env}
      MINIO_REGION_NAME: ${STORAGE_REGION:-us-east-1}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9001}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  storage-init:
    image: distributed-data-backend:local
    build: ./backend
    depends_on:
      minio:
        condition: service_healthy
    environment:
      TRINO_S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY:?Define TRINO_S3_ACCESS_KEY in .env}
      TRINO_S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY:?Define TRINO_S3_SECRET_KEY in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Define MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Define MINIO_ROOT_PASSWORD in .env}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-lake}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Define STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Define STORAGE_SECRET_KEY in .env}
    command: ["--spring.main.web-application-type=none", "--storage.provision=true"]
    restart: "no"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$${MSSQL_SA_PASSWORD}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 5 -Q "SELECT 1" -o /dev/null'
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
      SEED_SCALE: ${SEED_SCALE:-small}
      SEED_CUSTOMERS: ${SEED_CUSTOMERS:-}
      SEED_INVOICES: ${SEED_INVOICES:-}
    volumes:
      - ./sql:/scripts:ro
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - bash /scripts/init.sh
    restart: "no"

  backend-init:
    image: distributed-data-backend:local
    build: ./backend
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD in .env}
      SOURCE_PASSWORD: ${LAKE_READER_PASSWORD:?Define LAKE_READER_PASSWORD in .env}
    command: ["--spring.main.web-application-type=none", "--app.provision=true"]
    restart: "no"

  backend:
    image: distributed-data-backend:local
    build: ./backend
    depends_on:
      trino:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      metadata:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    environment:
      <<: *catalog-env
      APP_LOGIN_USERNAME: ${APP_LOGIN_USERNAME:-admin}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:?Run scripts/setup-login.ps1 or define APP_LOGIN_PASSWORD in .env}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      SOURCE_HOST: sqlserver
      SOURCE_DATABASE: BusinessDB
      SOURCE_USERNAME: lake_reader
      SOURCE_PASSWORD: ${LAKE_READER_PASSWORD:?Define LAKE_READER_PASSWORD in .env}
      SOURCE_TRUST_SERVER_CERTIFICATE: "true"
      STORAGE_ENABLED: "true"
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-lake}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Define STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Define STORAGE_SECRET_KEY in .env}
      JOBS_ENABLED: "true"
      JOBS_PASSWORD: ${JOBS_PASSWORD:?Define JOBS_PASSWORD in .env}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: distributed-data-frontend:local
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    ports:
      - "127.0.0.1:3000:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  backend-tests:
    profiles: ["tools"]
    build:
      context: ./backend
      target: development
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *catalog-env
      APP_LOGIN_USERNAME: ${APP_LOGIN_USERNAME:-admin}
      APP_LOGIN_PASSWORD: ${APP_LOGIN_PASSWORD:?Define APP_LOGIN_PASSWORD in .env}
      RUN_DB_TESTS: "true"
      RUN_STORAGE_TESTS: "true"
      RUN_JOB_TESTS: "true"
      TRINO_S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY:?Define TRINO_S3_ACCESS_KEY in .env}
      TRINO_S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY:?Define TRINO_S3_SECRET_KEY in .env}
      CATALOG_SCHEMA_SUFFIX: _test
      JOBS_ENABLED: "true"
      JOBS_DISPATCH_ENABLED: "false"
      JOBS_JDBC_URL: jdbc:postgresql://metadata:5432/atlas_test
      JOBS_PASSWORD: ${JOBS_PASSWORD:?Define JOBS_PASSWORD in .env}
      SOURCE_HOST: sqlserver
      SOURCE_PASSWORD: ${LAKE_READER_PASSWORD:?Define LAKE_READER_PASSWORD in .env}
      SOURCE_TRUST_SERVER_CERTIFICATE: "true"
      STORAGE_ENABLED: "true"
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-lake}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Define STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Define STORAGE_SECRET_KEY in .env}
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
    command: ["mvn", "-B", "test"]

  metastore-db-init:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    depends_on:
      metadata:
        condition: service_healthy
    environment:
      PGHOST: metadata
      PGUSER: atlas_admin
      POSTGRES_USER: atlas_admin
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Define POSTGRES_ADMIN_PASSWORD in .env}
      METASTORE_PASSWORD: ${METASTORE_PASSWORD:?Define METASTORE_PASSWORD in .env}
    volumes:
      - ./infra/postgres/02-metastore.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"

  hive-metastore:
    image: distributed-data-metastore:local
    build: ./infra/hive
    depends_on:
      metastore-db-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment:
      METASTORE_PASSWORD: ${METASTORE_PASSWORD:?Define METASTORE_PASSWORD in .env}
      TRINO_S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY:?Define TRINO_S3_ACCESS_KEY in .env}
      TRINO_S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY:?Define TRINO_S3_SECRET_KEY in .env}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/9083'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  trino:
    image: distributed-data-trino:local
    build: ./infra/trino
    depends_on:
      hive-metastore:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      TRINO_S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY:?Define TRINO_S3_ACCESS_KEY in .env}
      TRINO_S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY:?Define TRINO_S3_SECRET_KEY in .env}
      TRINO_REGISTRAR_PASSWORD: ${TRINO_REGISTRAR_PASSWORD:?Define TRINO_REGISTRAR_PASSWORD in .env}
      TRINO_READER_PASSWORD: ${TRINO_READER_PASSWORD:?Define TRINO_READER_PASSWORD in .env}
      TRINO_KEYSTORE_PASSWORD: ${TRINO_KEYSTORE_PASSWORD:?Define TRINO_KEYSTORE_PASSWORD in .env}
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET:?Define TRINO_SHARED_SECRET in .env}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${TRINO_PORT:-8089}:8443"
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:8443/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    restart: unless-stopped

volumes:
  metadata-data:
  spark-recovery:
  minio-data:
  sqlserver-data:
  maven-cache:

