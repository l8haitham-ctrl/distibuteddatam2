server:
  port: ${PORT:8000}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: ATLAS_SESSION
        path: /
        http-only: true
        same-site: strict
        secure: ${APP_COOKIE_SECURE:false}
spring:
  application:
    name: atlas-data-explorer
  jackson:
    deserialization:
      fail-on-unknown-properties: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /openapi.json
source:
  host: ${SOURCE_HOST:sqlserver}
  port: ${SOURCE_PORT:1433}
  database: ${SOURCE_DATABASE:BusinessDB}
  username: ${SOURCE_USERNAME:lake_reader}
  password: ${SOURCE_PASSWORD:}
  trust-server-certificate: ${SOURCE_TRUST_SERVER_CERTIFICATE:false}
auth:
  username: ${APP_LOGIN_USERNAME:admin}
  password: ${APP_LOGIN_PASSWORD:}
storage:
  enabled: ${STORAGE_ENABLED:false}
  endpoint: ${STORAGE_ENDPOINT:http://minio:9000}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET:lake}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
jobs:
  enabled: ${JOBS_ENABLED:false}
  dispatch-enabled: ${JOBS_DISPATCH_ENABLED:true}
  jdbc-url: ${JOBS_JDBC_URL:jdbc:postgresql://metadata:5432/atlas}
  username: ${JOBS_USERNAME:atlas}
  password: ${JOBS_PASSWORD:}
  poll-delay-ms: ${JOBS_POLL_DELAY_MS:2000}
  timeout-seconds: ${JOBS_TIMEOUT_SECONDS:1800}
  spark-rest-url: ${SPARK_REST_URL:http://spark-master:6066}
  spark-master: ${SPARK_MASTER:spark://spark-master:7077}
catalog:
  enabled: ${CATALOG_ENABLED:false}
  jdbc-url: ${TRINO_JDBC_URL:jdbc:trino://trino:8443/hive?SSL=true&SSLVerification=NONE}
  registrar-password: ${TRINO_REGISTRAR_PASSWORD:}
  reader-password: ${TRINO_READER_PASSWORD:}
  schema-suffix: ${CATALOG_SCHEMA_SUFFIX:}
