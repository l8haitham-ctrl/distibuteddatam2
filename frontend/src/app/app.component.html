<div class="app-shell wf-shell">
  <aside class="sidebar wf-sidebar" aria-label="Navigation principale">
    <a class="wf-brand" routerLink="/sources" [queryParams]="queryParams"><span><app-icon name="Layers3" [size]="16"/></span><strong>Data Platform</strong></a>
    <nav class="wf-navigation"><a routerLink="/sources" [queryParams]="queryParams" routerLinkActive="active" [attr.aria-current]="section()==='Data Sources' ? 'page' : null"><app-icon name="Database" [size]="15"/>Data Sources</a><a routerLink="/explorer" [queryParams]="queryParams" routerLinkActive="active"><app-icon name="List" [size]="15"/>Source Explorer</a><a routerLink="/storage" [queryParams]="queryParams" routerLinkActive="active"><app-icon name="Box" [size]="15"/>Storage</a><a routerLink="/jobs" [queryParams]="queryParams" routerLinkActive="active"><app-icon name="Activity" [size]="15"/>Storage Jobs</a></nav>
    @if(mockup){<small class="wf-demo-label">Maquette · données illustratives</small>}
  </aside>
  <div class="main-shell wf-main-shell"><header class="topbar wf-topbar"><div class="wf-breadcrumb">@if(adding()){<a routerLink="/sources" [queryParams]="queryParams">Data Sources</a><app-icon name="ChevronRight" [size]="14"/><strong>Ajouter une connexion SQL Server</strong>}@else{<strong>{{section()}}</strong>}</div><div class="wf-profile-wrap"><button class="wf-profile" [attr.aria-expanded]="menu()" (click)="menu.set(!menu())"><span class="wf-avatar">{{mockup ? 'AK' : 'PL'}}</span><span>{{mockup ? 'Amal Kettani' : 'Projet local'}}</span><app-icon name="ChevronDown" [size]="14"/></button>@if(menu()){<div class="wf-profile-menu"><a href="/api/docs" target="_blank" rel="noreferrer">Documentation API <app-icon name="ArrowUpRight" [size]="13"/></a><a routerLink="/sql" [queryParams]="queryParams">Console SQL <app-icon name="TerminalSquare" [size]="13"/></a><a [href]="mockup ? '/sources' : '/sources?maquette=1'">{{mockup ? 'Ouvrir l’application' : 'Voir la maquette'}}</a></div>}</div></header><main><router-outlet/></main></div>
</div>
